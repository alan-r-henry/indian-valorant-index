/* Layout: sticky command bar + one routed view; dense data tables in scroll wells; profiles as full views. */

@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {

:root[data-theme="light"] {
  --bg: #f3f4f7; --panel: #ffffff; --panel2: #eef0f5; --line: #dde0e8; --fg: #161923; --muted: #5d6476;

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 14px; line-height: 1.45; margin: 0; }

:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num, td.n, th.n { font-variant-numeric: tabular-nums; }
.wrap { max-width: 1320px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

<script>
"use strict";
const D = window.IVI_DATA;
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = (v, d = 2) => v == null || isNaN(v) ? "–" : (+v).toFixed(d);
const pct = (v, d = 0) => v == null || isNaN(v) ? "–" : (v * 100).toFixed(d) + "%";
const pctRaw = (v, d = 0) => v == null || isNaN(v) ? "–" : (+v).toFixed(d) + "%";
const sgn = v => (v > 0 ? "+" : "") + v;
const img = u => (u = String(u || "").split("||")[0]) ? (u.startsWith("//") ? "https:" + u : (u.startsWith("/") ? "https://www.vlr.gg" + u : u)) : "";
const NOW = new Date(D.generated + "T00:00:00");
const daysAgo = d => Math.round((NOW - new Date(d + "T00:00:00")) / 864e5);
// Current season = the snapshot's year, unless it has barely started (then the previous year).

function initials(n) {
  const w = String(n || "?").replace(/[^A-Za-z0-9 ]/g, " ").trim().split(/\s+/).filter(Boolean);
  return (w.length > 1 ? w[0][0] + w[1][0] : (w[0] || "?").slice(0, 2)).toUpperCase();
}
function logoFallback(name, lg) {
  let h = 0; for (const ch of String(name || "")) h = (h * 31 + ch.charCodeAt(0)) % 360;
  return `<span class="logo logo-fb${lg ? " lg" : ""}" style="--h:${h}" aria-hidden="true">${esc(initials(name))}</span>`;
}
function logoHTML(url, name, lg = false) {
  const u = img(url);
  if (!u || /\/img\/vlr\/tmp\/vlr\.png$/.test(u)) return logoFallback(name, lg);
  const tag = (src, mode) => `<img class="logo${lg ? " lg" : ""}${mode}" src="${esc(src)}" alt="" data-n="${esc(name)}" loading="lazy">`;
  // Liquipedia logos can come as "light||dark": render both, CSS shows the one for the theme
  const dark = String(url).split("||")[1];
  return dark ? tag(u, " lm") + tag(img(dark), " dm") : tag(u, "");
}

/* ---------- derived ---------- */
const INDIAN = D.teams.filter(t => t.indian);
function teamPool(opts) {
  const win = opts.win || "now";
  const since = win === "now" ? isoAgo(365) : win === "season" ? SEASON + "-01-01" : win === "2y" ? isoAgo(730) : "0000";
  return D.teams.filter(t => (opts.scope === "sa" ? true : t.indian) && !!t.gc === (opts.circ === "gc") && t.last && t.last >= since && (win !== "now" || !t.inactive)
    && (win === "season" ? (t.y[SEASON] ? t.y[SEASON].series[0] + t.y[SEASON].series[1] : 0) : t.series[0] + t.series[1]) >= (opts.minSeries ?? 1));
}
function isoAgo(days) { return new Date(NOW - days * 864e5).toISOString().slice(0, 10); }
function rankTeams(list) { return list.slice().sort((a, b) => b.rating - a.rating); }
const RANKED = rankTeams(teamPool({ scope: "in", win: "now", circ: "open" }));
const RANKED_GC = rankTeams(teamPool({ scope: "in", win: "now", circ: "gc" }));
RANKED.forEach((t, i) => t.rank = i + 1);
function ratingAgo(t, days) {
  const cut = new Date(NOW - days * 864e5).toISOString().slice(0, 7);
  let r = null; for (const [m, v] of t.hist) { if (m <= cut) r = v; }
  return r;
}
function seasonDelta(t) {
  let before = null, last = null;
  for (const [m, v] of t.hist) { if (m < SEASON + "-01") before = v; last = v; }
  return before == null || !t.last || t.last < SEASON ? null : t.elo - before;
}
function bestMap(t) {
  let best = null;
  for (const [m, s] of Object.entries(t.mapstats)) { if (s.p >= 4 && m !== "?" && (!best || s.w / s.p > best[1])) best = [m, s.w / s.p, s.p]; }
  return best;
}

/* ---------- charts ---------- */
function lineChart(points, { w = 640, h = 180, yfmt = v => Math.round(v), label = "" } = {}) {
  if (!points.length) return `<div class="empty">No history yet</div>`;
  const pad = { l: 38, r: 10, t: 10, b: 22 };
  const ys = points.map(p => p[1]); let mn = Math.min(...ys), mx = Math.max(...ys);
  if (mx - mn < 40) { mn -= 20; mx += 20; }
  const x = i => pad.l + (points.length === 1 ? (w - pad.l - pad.r) / 2 : i * (w - pad.l - pad.r) / (points.length - 1));
  const y = v => pad.t + (mx - v) * (h - pad.t - pad.b) / (mx - mn);
  const ticks = 4, grid = [];
  for (let i = 0; i <= ticks; i++) { const v = mn + (mx - mn) * i / ticks; grid.push(`<line class="chart-grid" x1="${pad.l}" x2="${w - pad.r}" y1="${y(v)}" y2="${y(v)}"/><text x="${pad.l - 6}" y="${y(v) + 3}" text-anchor="end">${yfmt(v)}</text>`); }
  const d = points.map((p, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(p[1]).toFixed(1)}`).join("");
  const area = d + `L${x(points.length - 1)},${h - pad.b}L${x(0)},${h - pad.b}Z`;
  const step = Math.max(1, Math.ceil(points.length / 8));
  const xl = points.map((p, i) => i % step === 0 || i === points.length - 1 ? `<text x="${x(i)}" y="${h - 6}" text-anchor="middle">${esc(p[0])}</text>` : "").join("");
  const last = points[points.length - 1];
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" role="img" aria-label="${esc(label)}">${grid.join("")}<path class="chart-area" d="${area}"/><path class="chart-line" d="${d}"/><circle cx="${x(points.length - 1)}" cy="${y(last[1])}" r="3.5" fill="var(--accent)"/>${xl}</svg>`;
}
function spark(points, w = 90, h = 24) {
  if (!points || points.length < 2) return "";
  const ys = points.map(p => p[1]); const mn = Math.min(...ys), mx = Math.max(...ys) || 1, rg = (mx - mn) || 1;
  const d = points.map((p, i) => `${i ? "L" : "M"}${(i * w / (points.length - 1)).toFixed(1)},${(h - 2 - (p[1] - mn) * (h - 4) / rg).toFixed(1)}`).join("");
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><path d="${d}" fill="none" stroke="var(--accent)" stroke-width="1.5"/></svg>`;
}
function multiLine(series, months, { w = 760, h = 240, yfmt = v => (v * 100).toFixed(0) + "%" } = {}) {
  const pad = { l: 40, r: 10, t: 10, b: 22 };
  const all = series.flatMap(s => s.v); const mx = Math.max(...all, 0.01);
  const x = i => pad.l + i * (w - pad.l - pad.r) / Math.max(1, months.length - 1);
  const y = v => pad.t + (mx - v) * (h - pad.t - pad.b) / mx;
  let g = ""; for (let i = 0; i <= 4; i++) { const v = mx * i / 4; g += `<line class="chart-grid" x1="${pad.l}" x2="${w - pad.r}" y1="${y(v)}" y2="${y(v)}"/><text x="${pad.l - 6}" y="${y(v) + 3}" text-anchor="end">${yfmt(v)}</text>`; }
  const step = Math.max(1, Math.ceil(months.length / 9));
  const xl = months.map((m, i) => i % step === 0 ? `<text x="${x(i)}" y="${h - 6}" text-anchor="middle">${m}</text>` : "").join("");
  const lines = series.map(s => `<path d="${s.v.map((v, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join("")}" fill="none" stroke="${s.c}" stroke-width="2"/>`).join("");
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" role="img" aria-label="Pick rate over time">${g}${lines}${xl}</svg>`;
}
const PALETTE = ["#f0a63a", "#3fbf9f", "#7aa7ff", "#e8615a", "#c86bd6", "#9fd45a", "#ff8a3d", "#5fd0e6", "#d9d36a", "#b5a3ff"];

/* ---------- sortable table helper ---------- */
function table(id, cols, rows, state, opts = {}) {
  const key = state.sort, dir = state.dir;
  const col = cols.find(c => c.k === key) || cols[0];
  const sorted = rows.slice().sort((a, b) => {
    const va = col.v(a), vb = col.v(b);
    const na = va == null || (typeof va === "number" && isNaN(va)), nb = vb == null || (typeof vb === "number" && isNaN(vb));
    if (na && nb) return 0; if (na) return 1; if (nb) return -1;
    return (va > vb ? 1 : va < vb ? -1 : 0) * dir;
  });
  const lim = opts.limit ? sorted.slice(0, opts.limit) : sorted;
  const head = cols.map(c => `<th class="${c.n ? "n" : ""} ${c.k === key ? "sorted" : ""} ${c.stick ? "stk" : ""}" data-k="${c.k}" tabindex="0" aria-sort="${c.k === key ? (dir < 0 ? "descending" : "ascending") : "none"}" title="${esc(c.t || c.h)}">${c.h}${c.k === key ? ` <span class="arr">${dir < 0 ? "▼" : "▲"}</span>` : ""}</th>`).join("");
  const body = lim.map((r, i) => `<tr class="${i < 3 && opts.rankCol ? "top3" : ""}">${cols.map(c => `<td class="${c.n ? "n" : ""} ${c.cls || ""} ${c.stick ? "stk" : ""}">${c.f ? c.f(r, i) : esc(c.v(r))}</td>`).join("")}</tr>`).join("");
  return `<div class="tw"><table id="${id}"><thead><tr>${head}</tr></thead><tbody>${body || `<tr><td colspan="${cols.length}" class="empty">Nothing matches these filters</td></tr>`}</tbody></table></div>`;
}
function bindSort(root, state, rerender, defDir = {}) {
  root.querySelectorAll("th[data-k]").forEach(th => th.onclick = () => {
    const k = th.dataset.k;
    if (state.sort === k) state.dir *= -1; else { state.sort = k; state.dir = defDir[k] ?? -1; }
    rerender();
  });
  root.querySelectorAll("th[data-k]").forEach(th => th.onkeydown = e => {
    if (e.key !== "Enter" && e.key !== " ") return;
    e.preventDefault(); const k = th.dataset.k; th.click();
    document.querySelector(`th[data-k="${k}"]`)?.focus();
  });
}

/* ---- Circuit tracker ---- */
const STAGE_RANK = [
  [/grand final|^final|final stage/i, 7, "Final"], [/playoff|upper|lower|semifinal|knockout/i, 6, "Playoffs"],
  [/group|league|regular|round robin|swiss|main event|chapter/i, 5, "Main"], [/qualifier playoffs|qualifier #?\d? ?playoff/i, 4, "Q-Playoffs"],
  [/last chance/i, 3, "OQ-LC"], [/open qualifier|qualifier/i, 2, "OQ"], [/promotion|relegation/i, 4, "Promo/Rel"],
];
function stageOf(stages) {
  let best = [0, "–"];
  for (const s of stages) for (const [re, r, lab] of STAGE_RANK) if (re.test(s)) { if (r > best[0]) best = [r, lab]; break; }
  return best;
}
const C_DEF = { tier: "challengers", years: PREV + "-" + SEASON };
const cState = Object.assign({}, C_DEF, store.get("cstate", {}));
V.circuit = () => {
  const tiers = ["challengers", "ascension", "vct_pacific", "international", "gc", "national", "third_party"];
  const evs = D.events.filter(e => e.tier === cState.tier && (cState.years === "all" || cState.years.split("-").some(y => e.start.startsWith(y)))).sort((a, b) => a.start.localeCompare(b.start));
  const yrList = [...new Set(D.events.map(e => e.start.slice(0, 4)).filter(y => y >= "2020"))].sort().reverse();
  const evIds = new Set(evs.map(e => e.id));
  const rows = new Map();
  for (const t of D.teams) {
    if (!t.indian) continue;
    for (const e of t.events) if (evIds.has(e.e)) { if (!rows.has(t.id)) rows.set(t.id, {}); rows.get(t.id)[e.e] = e; }
  }
  const scoreTeam = id => { const r = rows.get(id); let s = 0; for (const e of Object.values(r)) { const st = stageOf(e.st); s += st[0] * 10 + (e.place && /^1/.test(e.place) ? 30 : e.place && /^2/.test(e.place) ? 20 : 0) + e.w; } return s; };
  const teamIds = [...rows.keys()].sort((a, b) => scoreTeam(b) - scoreTeam(a)).slice(0, 150);
  const cell = e => {
    if (!e) return `<td class="muted">·</td>`;
    const st = stageOf(e.st); const place = e.place ? e.place.replace(/(st|nd|rd|th)/g, "") : "";
    const strong = place ? (/^1$/.test(place) ? "var(--gold)" : /^2$/.test(place) ? "var(--silver)" : /^3/.test(place) ? "var(--bronze)" : "var(--accent)") : null;
    const bg = strong ? `background:color-mix(in srgb, ${strong} 30%, transparent)` : `background:color-mix(in srgb, var(--accent) ${st[0] * 5}%, transparent)`;
    return `<td title="${esc(e.st.join(" → "))} · series ${e.w}-${e.l} · maps ${e.mw}-${e.ml}"><span class="stage" style="${bg}">${place ? esc(place) : st[1]}</span><div class="small muted">${e.w}-${e.l}</div></td>`;
  };
  const html = `
  <div class="sec-head"><div><div class="eyebrow">Circuit tracker</div><h1>How Indian teams fare, event by event</h1>
  <p class="lede">Each cell is a team's deepest stage in that event (OQ = open qualifier, OQ-LC = last-chance open qualifier, Q-Playoffs, Main, Playoffs, Final) or its final placing where VLR records one, with series W–L below. Hover a cell for the full path.</p></div></div>
  <div class="sec filters">
    <label>Circuit<span class="seg" id="ctier">${tiers.map(t => `<button type="button" data-v="${t}" class="${cState.tier === t ? "on" : ""}">${TIER_LABEL[t]}</button>`).join("")}</span></label>
    <label>Years<span class="seg" id="cyrs">${[PREV + "-" + SEASON, ...yrList, "all"].map(y => `<button type="button" data-v="${y}" class="${cState.years === y ? "on" : ""}">${y === "all" ? "All" : y.replace("-", "–")}</button>`).join("")}</span></label>
    <span class="count">${evs.length} events · ${teamIds.length} teams</span>
  </div>
  <div class="sec panel flush"><div class="tw"><table class="matrix"><thead><tr><th>Team</th>${evs.map(e => `<th title="${esc(e.title)}"><a href="#event-${e.id}">${esc(shortEv(e.title))}</a><div class="small muted" style="text-transform:none;letter-spacing:0">${e.start.slice(0, 7)}</div></th>`).join("")}</tr></thead>
  <tbody>${teamIds.map(id => `<tr><td>${teamLink(id)}</td>${evs.map(e => cell(rows.get(id)[e.id])).join("")}</tr>`).join("") || `<tr><td class="empty">No Indian teams recorded in this circuit for these years</td></tr>`}</tbody></table></div></div>
  ${intlSummary()}`;
  return { html, bind(root) {
    root.querySelectorAll("#ctier button").forEach(b => b.onclick = () => { cState.tier = b.dataset.v; store.set("cstate", cState); render(); });

  } };
};
function shortEv(t) {

  rows.sort((a, b) => b[1].d.localeCompare(a[1].d));

  <div class="tw"><table><thead><tr><th>Date</th><th>Team</th><th>Event</th><th>Circuit</th><th class="n">Series</th><th class="n">Maps</th><th>Result</th></tr></thead><tbody>
  ${rows.map(([t, e]) => `<tr><td class="small">${e.d}</td><td>${teamLink(t.id)}</td><td><a href="#event-${e.e}">${esc(EVENT.get(e.e)?.title || "")}</a></td><td>${tierTag(e.tier)}</td><td class="n">${e.w}–${e.l}</td><td class="n">${e.mw}–${e.ml}</td><td>${esc(e.place || stageOf(e.st)[1])}</td></tr>`).join("") || `<tr><td colspan="7" class="empty">None recorded</td></tr>`}

}

/* ---- Events ---- */
const E_DEF = { tier: "all", year: "all", q: "" };
const eState = Object.assign({}, E_DEF, store.get("estate", {}));
V.events = () => {
  const years = [...new Set(D.events.map(e => e.start.slice(0, 4)).filter(Boolean))].sort().reverse();
  const list = D.events.filter(e => (eState.tier === "all" || e.tier === eState.tier) && (eState.year === "all" || e.start.startsWith(eState.year)) && (!eState.q || e.title.toLowerCase().includes(eState.q.toLowerCase())) && e.ind.length);
  const html = `
  <div class="sec-head"><div><div class="eyebrow">Tournaments</div><h1>Every event with an Indian team</h1>
  <p class="lede">${D.events.filter(e => e.ind.length).length} events from 2020 to now: Riot's Challengers South Asia and its open qualifiers, Game Changers, Ascension and Last Chance Qualifiers, VCT Pacific and international events, national-team play, and third-party cups.</p></div></div>
  <div class="sec filters">
    <label for="etier">Circuit<select id="etier"><option value="all">All circuits</option>${Object.entries(TIER_LABEL).map(([k, v]) => `<option value="${k}" ${eState.tier === k ? "selected" : ""}>${v}</option>`).join("")}</select></label>
    <label for="eyr">Year<select id="eyr"><option value="all">All years</option>${years.map(y => `<option ${eState.year === y ? "selected" : ""}>${y}</option>`).join("")}</select></label>

  </div>
  <div class="sec panel flush"><div class="tw"><table><thead><tr><th>Dates</th><th>Event</th><th>Circuit</th><th class="n">Prize</th><th>Winner</th><th>Best Indian result</th><th class="n">Indian teams</th></tr></thead><tbody>
  ${list.map(e => { const w = e.places.find(p => /^1/.test(p.place)); const best = bestIndian(e);
    return `<tr><td class="small">${esc(e.dates || e.start)}</td><td><a href="#event-${e.id}"><b>${esc(e.title)}</b></a></td><td>${tierTag(e.tier)}</td><td class="n small">${esc(e.prize)}</td><td>${w ? (w.team_id ? teamLink(w.team_id) : esc(w.team)) : "–"}</td><td>${best ? `${teamLink(best[0])} <span class="muted small">${esc(best[1])}</span>` : "–"}</td><td class="n">${e.ind.length}</td></tr>`; }).join("")}
  </tbody></table></div></div>`;
  return { html, bind(root) {
    const re = () => { store.set("estate", eState); render(); };
    $("#etier", root).onchange = e => { eState.tier = e.target.value; re(); };
    $("#eyr", root).onchange = e => { eState.year = e.target.value; re(); };

  } };
};
function placeNum(p) { const m = /^(\d+)/.exec(p || ""); return m ? +m[1] : 999; }
function bestIndian(e) {
  let best = null;
  for (const [tid, place, w, l] of e.ind) {
    const t = TEAM.get(tid); if (!t) continue;
    const ev = t.events.find(x => x.e === e.id); const st = ev ? stageOf(ev.st) : [0, "–"];
    const score = place ? 1000 - placeNum(place) : st[0] * 10 + w;
    if (!best || score > best[2]) best = [tid, place ? place : st[1] + ` (${w}-${l})`, score];
  }
  return best;
}

/* ---- Meta ---- */
V.meta = () => {
  const months = Object.keys(D.agent_month).filter(m => m >= "2024-01");
  const tot = months.map(m => Object.values(D.agent_month[m]).reduce((a, b) => a + b, 0));
  const totals = {}; months.slice(-6).forEach(m => { for (const [a, n] of Object.entries(D.agent_month[m])) totals[a] = (totals[a] || 0) + n; });
  const topAgents = Object.entries(totals).sort((a, b) => b[1] - a[1]).slice(0, 8).map(x => x[0]);
  // 3-month rolling share of team compositions: each composition has 5 agents
  const series = topAgents.map((a, i) => ({ a, c: PALETTE[i], v: months.map((m, j) => { let n = 0, t = 0; for (let k = Math.max(0, j - 2); k <= j; k++) { n += D.agent_month[months[k]][a] || 0; t += tot[k]; } return t ? n / (t / 5) : 0; }) }));
  const recentPicks = Object.entries(totals).sort((a, b) => b[1] - a[1]);
  const recentTotal = recentPicks.reduce((s, x) => s + x[1], 0) / 5;
  const mapTot = {}; Object.entries(D.map_month).filter(([m]) => m >= months[Math.max(0, months.length - 12)]).forEach(([, o]) => { for (const [k, v] of Object.entries(o)) if (k && k !== "null") mapTot[k] = (mapTot[k] || 0) + v; });
  const mapsSorted = Object.entries(mapTot).sort((a, b) => b[1] - a[1]);
  const mx = mapsSorted[0]?.[1] || 1;
  const sides = Object.entries(D.map_side).filter(([m, v]) => v[2] >= 20).map(([m, v]) => [m, v[0] / (v[0] + v[1]), v[2]]).sort((a, b) => b[1] - a[1]);
  const roleShare = {}; for (const [a, n] of recentPicks) { const r = D.agent_role[a] || "?"; roleShare[r] = (roleShare[r] || 0) + n; }
  return `
  <div class="sec-head"><div><div class="eyebrow">Meta</div><h1>What Indian teams pick</h1><p class="lede">Agent and map trends across every map involving an Indian team. Pick rate is the share of team compositions that included the agent (three-month rolling average in the chart).</p></div></div>
  <div class="sec panel"><h3>Agent pick rate, top 8 of the last six months</h3><div class="legend" style="margin-bottom:8px">${series.map(s => `<span><i style="background:${s.c}"></i>${agName(s.a)}</span>`).join("")}</div>${multiLine(series, months)}</div>
  <div class="sec grid g3">
    <div class="panel flush"><div style="padding:14px 16px 6px"><h3>Agents · last six months</h3></div><div class="tw"><table><thead><tr><th>Agent</th><th>Role</th><th class="n">Pick rate</th><th></th></tr></thead><tbody>
    ${recentPicks.slice(0, 22).map(([a, n]) => `<tr><td><b>${agName(a)}</b></td><td class="small" style="color:${ROLE_COLORS[D.agent_role[a]] || "inherit"}">${D.agent_role[a] || "?"}</td><td class="n">${pct(n / recentTotal)}</td><td><span class="bar-cell" style="width:${Math.round(80 * n / recentPicks[0][1])}px"></span></td></tr>`).join("")}
    </tbody></table></div></div>
    <div class="panel flush"><div style="padding:14px 16px 6px"><h3>Maps played · last 12 months</h3></div><div class="tw"><table><thead><tr><th>Map</th><th class="n">Maps</th><th></th></tr></thead><tbody>
    ${mapsSorted.map(([m, n]) => `<tr><td><b>${esc(m)}</b></td><td class="n">${n}</td><td><span class="bar-cell" style="width:${Math.round(110 * n / mx)}px"></span></td></tr>`).join("")}
    </tbody></table></div></div>
    <div class="panel flush"><div style="padding:14px 16px 6px"><h3>Attack-side round win %</h3><p class="note">All recorded maps, minimum 20.</p></div><div class="tw"><table><thead><tr><th>Map</th><th class="n">Atk</th><th class="n">Def</th><th class="n">Maps</th></tr></thead><tbody>
    ${sides.map(([m, a, n]) => `<tr><td><b>${esc(m)}</b></td><td class="n ${a > .5 ? "win" : ""}">${pct(a, 1)}</td><td class="n ${a < .5 ? "win" : ""}">${pct(1 - a, 1)}</td><td class="n">${n}</td></tr>`).join("")}
    </tbody></table></div></div>
  </div>
  <div class="sec panel"><h3>Role mix of picks · last six months</h3><div class="grid g4">${Object.entries(roleShare).filter(([r]) => r !== "?").sort((a, b) => b[1] - a[1]).map(([r, n]) => `<div><div class="small muted">${r}</div><div style="font-family:var(--display);font-size:26px;font-weight:700;color:${ROLE_COLORS[r]}">${pct(n / (recentTotal * 5), 1)}</div></div>`).join("")}</div></div>`;
};

/* ---- Records ---- */
V.records = () => {
  const titles = INDIAN.map(t => [t, t.events.filter(e => /^1/.test(e.place))]).filter(x => x[1].length).sort((a, b) => b[1].length - a[1].length).slice(0, 15);
  const earn = INDIAN.filter(t => t.winnings).map(t => [t, +t.winnings.replace(/[$,]/g, "")]).sort((a, b) => b[1] - a[1]).slice(0, 15);

  games.sort((a, b) => b[1].rt - a[1].rt);
  const longest = INDIAN.map(t => [t, t.nmaps]).sort((a, b) => b[1] - a[1]).slice(0, 15);

  ${box("Highest peak rating", ["Team", "Peak", "Rating"], peaks.map(t => `<tr><td>${teamLink(t.id)}</td><td class="small muted">${esc(t.peak_date || "")}</td><td class="n"><b>${t.peak}</b></td></tr>`))}
  ${box("Best single-map ratings", ["Player", "Map", "Agent", "K/D/A", "Rating"], games.slice(0, 15).map(([p, b]) => `<tr><td>${playerLink(p.id)}</td><td class="small">${esc(b.map)} · <a href="https://www.vlr.gg/${b.mid}" target="_blank" rel="noopener">${b.d}</a></td><td class="small">${agName(b.ag)}</td><td class="small">${b.k}/${b.dth}/${b.a}</td><td class="n"><b>${fmt(b.rt)}</b></td></tr>`))}
  ${box("Best career adj. rating (150+ rated maps)", ["Player", "Maps", "Adj."], career.map(p => `<tr><td>${playerLink(p.id)}</td><td class="small">${p.career.rated}</td><td class="n"><b>${fmt(p.career.adj)}</b></td></tr>`))}
  ${box("Most maps played (player)", ["Player", "Since", "Maps"], vets.map(p => `<tr><td>${playerLink(p.id)}</td><td class="small muted">${p.first.slice(0, 4)}</td><td class="n">${p.career.maps}</td></tr>`))}
  ${box("Most maps played (team)", ["Team", "Maps"], longest.map(([t, n]) => `<tr><td>${teamLink(t.id)}</td><td class="n">${n}</td></tr>`))}

/* ---- About ---- */
V.about = () => `
  <div class="sec-head"><div><div class="eyebrow">Method</div><h1>Sources and method</h1></div></div>
  <div class="sec grid g2">
  <div class="panel"><h3>What counts as Indian</h3><p>A team counts as Indian when VLR lists its country as India, or when at least half of its recent lineups are Indian players. That covers Indian organisations on the Asia-Pacific (Mumbai) side, the Challengers South Asia ecosystem, and Indian rosters that entered SEA or Pacific events. Players count when VLR flags them as Indian; imports on Indian teams appear under a separate filter. Other South Asian teams (Bangladesh, Pakistan, Nepal, Sri Lanka, Maldives) are in the data as opponents and appear under "All South Asia" in the rankings.</p></div>
  <div class="panel"><h3>Team rating</h3><p>Elo over individual maps, run in date order over every recorded series since 2020. Each map moves ratings by K × margin factor × (result − expectation), where the margin factor grows with round difference (log) and is damped for heavy favourites. New teams use K = 40 for their first 15 maps, then 24. Indian and South Asian teams start at 1500; foreign teams start at 1600–1700, or 1850 if first seen in VCT Pacific or international events. After 60+ idle days a rating relaxes toward 1500 (8% per 90 days). The table ranks on that Elo minus a small-sample discount (150 × e<sup>−maps/10</sup>), so a team with ten maps gives up about 55 points and a team with fifty gives up one. Game Changers matches use a separate rating pool, since that circuit mostly plays within itself.</p></div>
  <div class="panel"><h3>Player stats</h3><p>Per-map lines from VLR match pages: Rating 2.0, ACS, kills, deaths, assists, KAST, ADR, HS%, first kills and deaths, with attack and defence splits. Rates are weighted by rounds. <b>Adj. rating</b> subtracts β × (opponent Elo − 1500) from each map's rating before averaging, where β is fitted by regressing map rating on opponent Elo across all the data: each extra 100 Elo of opponent strength costs a typical player ${fmt(-D.beta * 100, 3)} rating, so that much is added back. <b>Peak</b> is the 90th-percentile map rating and <b>Consistency</b> is its standard deviation. Ideas taken from 1trick.gg (Elevated's site: opponent-adjusted ratings, peak games, sample sizes) and from VLR and Liquipedia (stat sets and results), plus things they don't show for India: opponent-adjusted ratings, age and role filters, and circuit-by-circuit tracking.</p></div>
  <div class="panel"><h3>Indian players abroad</h3><p>Indian-flagged players on teams outside South Asia are found three ways: by scanning the rosters of every team in VLR's regional rankings (Asia-Pacific, EMEA, MENA, Americas, China, Japan, Korea, Oceania, Game Changers and collegiate), from Liquipedia players with Indian nationality, and from a hand-kept list in the repository (<code>data/abroad_extra.json</code>). Their matches since 2024 count towards their player stats and they carry an <span class="pill abroad">Abroad</span> tag everywhere. Those matches stay out of team ratings and results, and because their opponents have no rating here, the opponent strength used for the adjusted rating is estimated from the event: 1950 for VCT leagues and internationals, 1650 for Challengers, 1550 otherwise.</p></div>
  <div class="panel"><h3>Sources</h3><ul class="small" style="padding-left:18px;margin:0;display:grid;gap:4px">
    <li><a href="https://www.vlr.gg" target="_blank" rel="noopener">VLR.gg</a>: matches, maps, player stats, rosters, placements, prize money.</li>
    <li><a href="https://liquipedia.net/valorant" target="_blank" rel="noopener">Liquipedia VALORANT</a> (CC BY-SA): birth dates, IGL tags, real names, socials; team logos where VLR has none.</li>
    <li><a href="https://www.1trick.gg" target="_blank" rel="noopener">1trick.gg</a> (Elevated): reference for adjusted ratings and scouting layout.</li>
    <li>News reports for storylines: Sheep Esports, The Bridge, Outlook Respawn, Mykhel, VLR news.</li>
  </ul><p class="note">Data snapshot ${esc(D.generated)}. Matches VLR hasn't recorded (some small community cups and early open-qualifier rounds) are missing. Forfeits and maps under 13 rounds are excluded. "Indians abroad" only covers Indian players whose foreign teams met Indian opposition or played in South Asian events.</p></div>
  </div>`;

/* ---- Team profile ---- */

  const rk = (t.gc ? RANKED_GC : RANKED).findIndex(x => x.id === t.id) + 1;
  const players = t.roster.filter(r => r.role === "player" || r.role.includes("sub"));
  const staff = t.roster.filter(r => !(r.role === "player" || r.role.includes("sub")));
  const recentPlayers = D.players.filter(p => p.team === t.id && p.active).sort((a, b) => (b.cur?.maps || 0) - (a.cur?.maps || 0));
  const ms = D.matches.filter(m => m.t.includes(t.id)).slice(-25).reverse();

    ${TIER_ORDER.filter(k => tierRec[k]).map(k => `<tr><td>${tierTag(k)}</td><td class="n">${tierRec[k].n}</td><td class="n">${tierRec[k].w}–${tierRec[k].l}</td><td class="small">${tierRec[k].best ? `${esc(tierRec[k].best.place)} · <a href="#event-${tierRec[k].best.e}">${esc(EVENT.get(tierRec[k].best.e)?.title || "")}</a>` : "–"}</td></tr>`).join("")}
    </tbody></table></div>

  const v = p.cur?.[key]; if (v == null || !vals.length) return null;
  let i = 0; while (i < vals.length && vals[i] <= v) i++;
  const r = i / vals.length; return lowerBetter ? 1 - r : r;
}

/* ---------- shared widgets ---------- */
function toolbar(tableId, file) {
  return `<span class="toolbar"><button type="button" class="btn" data-csv="${tableId}" data-file="${file}">Download CSV</button><button type="button" class="btn" data-copy>Copy link</button></span>`;
}
function toast(msg) { const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 1800); }
function exportCSV(tbl, file) {
  const cell = el => '"' + el.innerText.replace(/[▲▼]/g, "").trim().replace(/\s*\n\s*/g, " / ").replace(/"/g, '""') + '"';
  const rows = [...tbl.querySelectorAll("tr")].map(tr => [...tr.children].map(cell).join(","));
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["\ufeff" + rows.join("\r\n")], { type: "text/csv;charset=utf-8" }));
  a.download = file; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
function bindWidgets(root) {
  root.querySelectorAll("[data-csv]").forEach(b => b.onclick = () => { const t = document.getElementById(b.dataset.csv); if (t) exportCSV(t, b.dataset.file); });
  root.querySelectorAll("[data-copy]").forEach(b => b.onclick = () => {
    const done = () => toast("Link copied");
    if (navigator.clipboard) navigator.clipboard.writeText(location.href).then(done, () => toast("Copy the address bar to share"));
    else toast("Copy the address bar to share");
  });
  root.querySelectorAll(".seg button").forEach(b => b.setAttribute("aria-pressed", b.classList.contains("on")));
}
function keyNav(e, box, pick) {
  const items = [...box.querySelectorAll("a")];
  if (e.key === "Escape") { box.hidden = true; return; }
  if (box.hidden || !items.length) return;
  let i = items.findIndex(a => a.classList.contains("act"));
  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    e.preventDefault();
    i = e.key === "ArrowDown" ? (i + 1) % items.length : (i <= 0 ? items.length - 1 : i - 1);
    items.forEach((a, j) => a.classList.toggle("act", j === i)); items[i].scrollIntoView({ block: "nearest" });
  } else if (e.key === "Enter") { e.preventDefault(); pick(items[Math.max(0, i)]); }
}
function searchHits(q, kind, filter) {
  return SEARCH.filter(x => (!kind || x.k === kind) && x.s.includes(q) && (!filter || filter(x)))
    .sort((a, b) => (b.n.toLowerCase() === q) - (a.n.toLowerCase() === q) || b.s.startsWith(q) - a.s.startsWith(q) || b.w - a.w).slice(0, 14);
}
function hitHTML(x, attr) {
  return `<a ${attr}>${x.k === "t" ? logoHTML(TEAM.get(x.id)?.logo || D.tlogos[x.id] || "", x.n) : ""}<b>${esc(x.n)}</b>${x.k === "p" ? abroadPill(PLAYER.get(x.id)) : ""}<small>${esc(x.sub)}</small></a>`;
}
function picker(id, ph) { return `<div class="picker"><input id="${id}" type="text" placeholder="${esc(ph)}" autocomplete="off" aria-label="${esc(ph)}"><div class="res" hidden></div></div>`; }
function bindPicker(root, id, kind, onPick, filter) {
  const inp = $("#" + id, root); if (!inp) return; const box = inp.nextElementSibling;
  inp.oninput = debounce(() => {
    const q = inp.value.trim().toLowerCase(); if (!q) { box.hidden = true; return; }
    box.innerHTML = searchHits(q, kind, filter).map(x => hitHTML(x, `href="#" data-id="${x.id}"`)).join("") || `<div class="empty">No match</div>`;
    box.hidden = false;
  }, 120);
  inp.onkeydown = e => keyNav(e, box, a => onPick(+a.dataset.id));
  box.onclick = e => { const a = e.target.closest("a[data-id]"); if (!a) return; e.preventDefault(); onPick(+a.dataset.id); };
}
function formChart(rows, { w = 640, h = 170 } = {}) {
  const pts = rows.filter(r => r[1] != null);
  if (pts.length < 3) return `<div class="empty">Not enough rated maps</div>`;
  const pad = { l: 34, r: 10, t: 10, b: 22 };
  const ys = pts.map(r => r[1]); const mn = Math.min(0.4, ...ys), mx = Math.max(1.6, ...ys);
  const x = i => pad.l + i * (w - pad.l - pad.r) / (pts.length - 1);
  const y = v => pad.t + (mx - v) * (h - pad.t - pad.b) / (mx - mn);
  let g = "";
  for (let v = Math.ceil(mn * 2) / 2; v <= mx; v += 0.5) g += `<line class="chart-grid" x1="${pad.l}" x2="${w - pad.r}" y1="${y(v)}" y2="${y(v)}" ${v === 1 ? 'stroke-dasharray="4 3"' : ""}/><text x="${pad.l - 6}" y="${y(v) + 3}" text-anchor="end">${v.toFixed(1)}</text>`;
  const roll = pts.map((_, i) => { const a = pts.slice(Math.max(0, i - 4), i + 1); return a.reduce((s, r) => s + r[1], 0) / a.length; });
  const line = roll.map((v, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join("");
  const dots = pts.map((r, i) => `<circle cx="${x(i).toFixed(1)}" cy="${y(r[1]).toFixed(1)}" r="3.2" fill="${r[7] ? "var(--pos)" : "var(--neg)"}" opacity=".85"><title>${esc(r[0])} · ${esc(tname(r[3]))} · ${esc(r[5] || "")} · ${fmt(r[1])}</title></circle>`).join("");
  const xl = `<text x="${pad.l}" y="${h - 6}">${esc(pts[0][0])}</text><text x="${w - pad.r}" y="${h - 6}" text-anchor="end">${esc(pts[pts.length - 1][0])}</text>`;
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" role="img" aria-label="Map ratings over the last ${pts.length} maps">${g}${dots}<path class="chart-line" d="${line}"/>${xl}</svg>`;
}
function multiForm(list, { w = 760, h = 200 } = {}) {
  const series = list.map(([p, c]) => { const pts = (p.recent || []).filter(r => r[1] != null); return { p, c, v: pts.map((_, i) => { const a = pts.slice(Math.max(0, i - 4), i + 1); return a.reduce((s, r) => s + r[1], 0) / a.length; }) }; }).filter(s => s.v.length >= 3);
  if (!series.length) return `<div class="empty">No recent maps to chart</div>`;
  const n = Math.max(...series.map(s => s.v.length)); const all = series.flatMap(s => s.v);
  const mn = Math.min(0.7, ...all), mx = Math.max(1.3, ...all); const pad = { l: 34, r: 10, t: 10, b: 22 };
  const x = i => pad.l + i * (w - pad.l - pad.r) / Math.max(1, n - 1);
  const y = v => pad.t + (mx - v) * (h - pad.t - pad.b) / (mx - mn);
  let g = ""; for (let v = Math.ceil(mn * 10) / 10; v <= mx + 1e-9; v += 0.2) g += `<line class="chart-grid" x1="${pad.l}" x2="${w - pad.r}" y1="${y(v)}" y2="${y(v)}"/><text x="${pad.l - 6}" y="${y(v) + 3}" text-anchor="end">${v.toFixed(1)}</text>`;
  const lines = series.map(s => { const off = n - s.v.length; return `<path d="${s.v.map((v, i) => `${i ? "L" : "M"}${x(i + off).toFixed(1)},${y(v).toFixed(1)}`).join("")}" fill="none" stroke="${s.c}" stroke-width="2.2"/>`; }).join("");
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" role="img" aria-label="Five-map rolling rating">${g}${lines}<text x="${pad.l}" y="${h - 6}">${n} maps ago</text><text x="${w - pad.r}" y="${h - 6}" text-anchor="end">latest</text></svg>`;
}

/* ---- Compare players ---- */
const CMP_DEF = { p: [], per: "cur" };
const cmpState = Object.assign({}, CMP_DEF);
V.compare = () => {
  const ps = cmpState.p.map(id => PLAYER.get(+id)).filter(Boolean).slice(0, 4);
  const colors = ["#f0a63a", "#7aa7ff", "#3fbf9f", "#e8615a"];
  const years = [...new Set(D.players.flatMap(p => Object.keys(p.seasons)))].sort().reverse();
  const st = p => pstat(p, cmpState.per);
  const M = [["adj", "Adj. rating", 2], ["rating", "Rating 2.0", 2], ["acs", "ACS", 0], ["kd", "K/D", 2], ["kast", "KAST", 0, "%"], ["adr", "ADR", 0], ["kpr", "Kills / round", 2], ["apr", "Assists / round", 2],
    ["fkpr", "First kills / round", 3], ["fdpr", "First deaths / round", 3, null, true], ["fkpct", "Opening duels won", 0, "x%"], ["hs", "Headshot %", 0, "%"], ["p90", "Peak (P90)", 2], ["sd", "Consistency σ", 2, null, true],
    ["rt_atk", "Attack rating", 2], ["rt_def", "Defence rating", 2], ["maps", "Maps", 0]];
  const val = (p, k) => st(p)?.[k];
  const show = (v, m) => v == null ? "–" : m[3] === "%" ? pctRaw(v) : m[3] === "x%" ? pct(v) : fmt(v, m[2]);
  const rows = M.map(m => {
    const vs = ps.map(p => val(p, m[0])); const ok = vs.filter(v => v != null);
    const best = ok.length > 1 ? (m[4] ? Math.min(...ok) : Math.max(...ok)) : null;
    const lo = Math.min(...ok), hi = Math.max(...ok);
    return `<tr><td>${m[1]}</td>${vs.map((v, i) => `<td class="n ${v != null && v === best ? "best" : ""}">${show(v, m)}${v != null && ok.length > 1 && hi > lo ? `<div><span class="bar-cell" style="width:${Math.round(8 + 52 * (m[4] ? hi - v : v - lo) / (hi - lo))}px;background:${colors[i]}"></span></div>` : ""}</td>`).join("")}</tr>`;
  }).join("");
  const info = [["Team", p => teamLink(p.team)], ["Role", p => `<span style="color:${ROLE_COLORS[p.role]}">${p.role}</span>`], ["Age", p => p.age ?? "–"], ["Main agents", p => p.agents.slice(0, 3).map(a => agName(a[0])).join(", ")], ["Career maps", p => p.career.maps], ["Region", p => p.abroad ? `<span class="pill abroad">Abroad · ${esc(p.abroad.region || "?")}</span>` : "South Asia"]]
    .map(([lab, f]) => `<tr><td>${lab}</td>${ps.map(p => `<td class="n">${f(p)}</td>`).join("")}</tr>`).join("");
  const suggest = D.players.filter(p => p.flag === "in" && p.active && !p.gc && p.cur && p.cur.maps >= 20 && p.cur.adj != null).sort((a, b) => b.cur.adj - a.cur.adj).slice(0, 4).map(p => p.id);
  const html = `
  <div class="sec-head"><div><div class="eyebrow">Compare</div><h1>Compare players</h1><p class="lede">Up to four players side by side: every stat for the chosen period, the best value in each row highlighted, plus recent form.</p></div></div>
  <div class="sec filters">
    <div class="slots">${ps.map((p, i) => `<span class="slot"><i style="background:${colors[i]}"></i>${esc(p.name)}<button type="button" data-rm="${p.id}" aria-label="Remove ${esc(p.name)}">×</button></span>`).join("")}
    ${ps.length < 4 ? picker("cmpadd", ps.length ? "Add a player" : "Search a player to compare") : ""}</div>
    <label for="cper">Period<select id="cper"><option value="cur">Last 12 months</option>${years.map(y => `<option value="${y}">${y} season</option>`).join("")}<option value="career">Career</option></select></label>
    <span class="toolbar">${ps.length ? `<button type="button" class="btn" id="cclr">Clear</button>` : `<button type="button" class="btn" id="csug">Try the top four</button>`}<button type="button" class="btn" data-copy>Copy link</button></span>
  </div>
  ${ps.length ? `
  <div class="sec panel flush"><div class="tw"><table class="cmp"><thead><tr><th class="pl"></th>${ps.map((p, i) => `<th class="pl n"><a href="#player-${p.id}" style="border-bottom:3px solid ${colors[i]}">${esc(p.name)}</a></th>`).join("")}</tr></thead><tbody>${info}${rows}</tbody></table></div></div>
  <div class="sec panel"><h3>Form · five-map rolling rating</h3><div class="legend" style="margin-bottom:8px">${ps.map((p, i) => `<span><i style="background:${colors[i]}"></i>${esc(p.name)}</span>`).join("")}</div>${multiForm(ps.map((p, i) => [p, colors[i]]))}</div>` : `<div class="sec empty">Pick players above, or press “Try the top four”.</div>`}`;
  return { html, bind(root) {
    const set = ids => { cmpState.p = ids.slice(0, 4).map(String); render(); };
    $("#cper", root).value = cmpState.per;
    $("#cper", root).onchange = e => { cmpState.per = e.target.value; render(); };
    root.querySelectorAll("[data-rm]").forEach(b => b.onclick = () => set(cmpState.p.filter(x => +x !== +b.dataset.rm)));
    bindPicker(root, "cmpadd", "p", id => { if (!cmpState.p.map(Number).includes(id)) set([...cmpState.p, id]); setTimeout(() => $("#cmpadd")?.focus()); });
    $("#cclr", root) && ($("#cclr", root).onclick = () => set([]));
    $("#csug", root) && ($("#csug", root).onclick = () => set(suggest));
  } };
};

/* ---- Head-to-head + predictor ---- */
const H_DEF = { a: 0, b: 0 };
const hState = Object.assign({}, H_DEF);
const winP = (ra, rb) => 1 / (1 + Math.pow(10, (rb - ra) / 400));
const bo3 = p => p * p * (3 - 2 * p);
const bo5 = p => p * p * p * (10 - 15 * p + 6 * p * p);
V.h2h = () => {
  const A = TEAM.get(+hState.a), B = TEAM.get(+hState.b);
  const side = (t, key, right) => t ? `<div class="side ${right ? "r" : ""}">${logoHTML(t.logo, t.name, true)}<div style="min-width:0"><h2 style="text-transform:none"><a href="#team-${t.id}">${esc(t.name)}</a></h2><div class="small muted">Rating ${t.rating} · ${t.series[0]}–${t.series[1]} series${t.inactive ? " · inactive" : ""}</div><button type="button" class="btn" data-clear="${key}" style="margin-top:6px">Change</button></div></div>`
    : `<div class="side ${right ? "r" : ""}">${picker("h2h" + key, right ? "Pick the second team" : "Pick a team")}</div>`;
  let body = "";
  if (A && B) {
    const p = winP(A.elo, B.elo);
    const meet = D.matches.filter(m => m.t.includes(A.id) && m.t.includes(B.id)).slice().reverse();
    let sw = 0, sl = 0, mw = 0, ml = 0;
    for (const m of meet) { const ai = m.t[0] === A.id ? 0 : 1; if (m.sc[ai] > m.sc[1 - ai]) sw++; else if (m.sc[ai] < m.sc[1 - ai]) sl++; mw += m.sc[ai]; ml += m.sc[1 - ai]; }
    const bar = (q, lab) => `<div style="display:grid;grid-template-columns:52px 1fr;gap:10px;align-items:center"><span class="small muted">${lab}</span><div class="prob"><span style="width:${Math.max(q * 100, 9)}%;background:color-mix(in srgb, var(--accent) 70%, transparent);color:var(--accent-ink)">${pct(q)}</span><span style="flex:1;justify-content:flex-end;background:color-mix(in srgb, var(--info) 45%, transparent)">${pct(1 - q)}</span></div></div>`;
    const maps = [...new Set([...Object.keys(A.mapstats), ...Object.keys(B.mapstats)])].filter(m => m !== "?" && ((A.mapstats[m]?.p || 0) + (B.mapstats[m]?.p || 0)) >= 3)
      .sort((x, y) => ((B.mapstats[y]?.recent || 0) + (A.mapstats[y]?.recent || 0)) - ((B.mapstats[x]?.recent || 0) + (A.mapstats[x]?.recent || 0)));
    const wr = s => s && s.p ? s.w / s.p : null;
    const cellWr = (s, other) => { const v = wr(s), o = wr(other); return `<td class="n ${v != null && o != null && v > o ? "win" : ""}">${v == null ? "–" : pct(v)} <span class="muted small">${s?.p || 0}</span></td>`; };
    const stat = (lab, f, better = 1) => { const va = f(A), vb = f(B); const fa = typeof va === "number" ? va : null, fb = typeof vb === "number" ? vb : null;
      return `<tr><td class="n ${fa != null && fb != null && (fa - fb) * better > 0 ? "win" : ""}">${typeof va === "number" && !Number.isInteger(va) ? va.toFixed(2) : va}</td><td style="text-align:center" class="muted small">${lab}</td><td class="${fa != null && fb != null && (fb - fa) * better > 0 ? "win" : ""}">${typeof vb === "number" && !Number.isInteger(vb) ? vb.toFixed(2) : vb}</td></tr>`; };
    const titles = t => t.events.filter(e => /^1/.test(e.place)).length;
    const mwr = t => +(100 * t.maps[0] / Math.max(1, t.maps[0] + t.maps[1])).toFixed(1);
    const rd = t => +((t.rounds[0] - t.rounds[1]) / Math.max(1, t.maps[0] + t.maps[1])).toFixed(2);
    body = `
    ${!!A.gc !== !!B.gc ? `<p class="note">One of these is a Game Changers team. The two circuits use separate rating pools, so the odds below are not meaningful.</p>` : ""}
    ${A.inactive || B.inactive ? `<p class="note">At least one team is inactive on VLR, so its rating is where it finished.</p>` : ""}
    <div class="sec grid g2">
      <div class="panel"><h3>If they met today</h3><div class="grid" style="gap:10px;margin-top:6px">${bar(p, "Map")}${bar(bo3(p), "Bo3")}${bar(bo5(p), "Bo5")}</div>
      <p class="note">Win chances from the raw Elo gap (${A.elo} vs ${B.elo}): ${esc(A.name)} in marigold, ${esc(B.name)} in blue. Series odds treat maps as independent and know nothing about roster changes, map vetoes or form.</p></div>
      <div class="panel flush"><div style="padding:14px 16px 6px"><h3>Tale of the tape</h3></div><div class="tw"><table><tbody>
        ${stat("Rating", t => t.rating)}${stat("Peak", t => t.peak)}${stat("Series W–L", t => `${t.series[0]}–${t.series[1]}`)}${stat("Map win %", mwr)}${stat("Round diff / map", rd)}${stat("Titles", titles)}${stat("Maps played", t => t.nmaps)}
        <tr><td class="n">${formBar(A.form)}</td><td style="text-align:center" class="muted small">Form</td><td>${formBar(B.form)}</td></tr>
      </tbody></table></div></div>
    </div>
    <div class="sec grid g2">
      <div class="panel flush"><div style="padding:14px 16px 6px"><h3>Map pools</h3><p class="note">Win % and maps played, all recorded maps; higher win rate in green.</p></div><div class="tw"><table><thead><tr><th>Map</th><th class="n">${esc(A.name)}</th><th class="n">${esc(B.name)}</th></tr></thead><tbody>
        ${maps.map(m => `<tr><td><b>${esc(m)}</b></td>${cellWr(A.mapstats[m], B.mapstats[m])}${cellWr(B.mapstats[m], A.mapstats[m])}</tr>`).join("")}
      </tbody></table></div></div>
      <div class="panel flush"><div style="padding:14px 16px 6px"><h3>Meetings · ${esc(A.name)} ${sw}–${sl} in series, ${mw}–${ml} in maps</h3></div>${meet.map(matchRow).join("") || `<div class="empty">They have never met in the recorded data</div>`}</div>
    </div>`;
  }
  const html = `
  <div class="sec-head"><div><div class="eyebrow">Head-to-head</div><h1>Head-to-head and match odds</h1><p class="lede">Pick two teams to see every meeting, their map pools side by side, and the win chances their ratings imply.</p></div>
  <span class="toolbar">${A && B ? `<button type="button" class="btn" id="hswap">Swap</button>` : ""}<button type="button" class="btn" data-copy>Copy link</button></span></div>
  <div class="sec panel"><div class="vs">${side(A, "a")}<div class="mid">vs</div>${side(B, "b", true)}</div></div>
  ${body || `<div class="sec empty">Choose two teams. Tip: open any team page and press “Head-to-head”.</div>`}`;
  return { html, bind(root) {
    bindPicker(root, "h2ha", "t", id => { hState.a = id; render(); setTimeout(() => $("#h2hb")?.focus()); });
    bindPicker(root, "h2hb", "t", id => { hState.b = id; render(); });
    root.querySelectorAll("[data-clear]").forEach(b => b.onclick = () => { hState[b.dataset.clear] = 0; render(); setTimeout(() => $("#h2h" + b.dataset.clear)?.focus()); });
    $("#hswap", root) && ($("#hswap", root).onclick = () => { [hState.a, hState.b] = [hState.b, hState.a]; render(); });
  } };
};

/* ---- Results browser ---- */
const R_DEF = { q: "", tier: "all", year: "all", scope: "all", page: 1 };
const rState = Object.assign({}, R_DEF);
V.results = () => {
  const years = [...new Set(D.matches.map(m => m.d.slice(0, 4)))].sort().reverse();
  const q = rState.q.trim().toLowerCase();
  const ind = id => !!TEAM.get(id)?.indian;
  const list = D.matches.filter(m => {
    if (rState.year !== "all" && !m.d.startsWith(rState.year)) return false;
    const ev = EVENT.get(m.e);
    if (rState.tier !== "all" && ev?.tier !== rState.tier) return false;
    if (rState.scope === "intl" && !(ind(m.t[0]) !== ind(m.t[1]) && !(TEAM.has(m.t[0]) && TEAM.has(m.t[1])))) return false;
    if (rState.scope === "derby" && !(ind(m.t[0]) && ind(m.t[1]))) return false;
    if (q && !(tname(m.t[0]).toLowerCase().includes(q) || tname(m.t[1]).toLowerCase().includes(q) || (ev?.title || "").toLowerCase().includes(q))) return false;
    return true;
  }).reverse();
  const per = 40, pages = Math.max(1, Math.ceil(list.length / per)); const page = Math.min(Math.max(1, rState.page), pages);
  const pager = `<div class="pager"><button type="button" class="btn" data-pg="${page - 1}" ${page <= 1 ? "disabled" : ""}>← Newer</button><span class="small muted">Page ${page} of ${pages}</span><button type="button" class="btn" data-pg="${page + 1}" ${page >= pages ? "disabled" : ""}>Older →</button></div>`;
  const html = `
  <div class="sec-head"><div><div class="eyebrow">Results</div><h1>Every recorded series</h1><p class="lede">${D.matches.length.toLocaleString()} series involving South Asian teams, newest first. Search by team or event.</p></div></div>
  <div class="sec filters">
    <label for="rq">Team or event<input id="rq" type="text" value="${esc(rState.q)}" placeholder="e.g. Revenant, VCSA"></label>
    <label for="rtier">Circuit<select id="rtier"><option value="all">All circuits</option>${Object.entries(TIER_LABEL).map(([k, v]) => `<option value="${k}" ${rState.tier === k ? "selected" : ""}>${v}</option>`).join("")}</select></label>
    <label for="ryr">Year<select id="ryr"><option value="all">All years</option>${years.map(y => `<option ${rState.year === y ? "selected" : ""}>${y}</option>`).join("")}</select></label>
    <label>Matchups<span class="seg" id="rscope">${[["all", "All"], ["derby", "Indian vs Indian"], ["intl", "Indian vs foreign"]].map(([k, v]) => `<button type="button" data-v="${k}" class="${rState.scope === k ? "on" : ""}">${v}</button>`).join("")}</span></label>
    <span class="count">${list.length.toLocaleString()} series</span><span class="toolbar"><button type="button" class="btn" data-copy>Copy link</button></span>
  </div>
  <div class="sec panel flush">${list.slice((page - 1) * per, page * per).map(matchRow).join("") || `<div class="empty">No series match</div>`}${pages > 1 ? pager : ""}</div>`;
  return { html, bind(root) {
    const re = () => { rState.page = 1; render(); };
    $("#rq", root).oninput = debounce(e => { rState.q = e.target.value; re(); setTimeout(() => { const i = $("#rq"); if (i) { i.focus(); i.setSelectionRange(i.value.length, i.value.length); } }); }, 300);
    $("#rtier", root).onchange = e => { rState.tier = e.target.value; re(); };
    $("#ryr", root).onchange = e => { rState.year = e.target.value; re(); };
    root.querySelectorAll("#rscope button").forEach(b => b.onclick = () => { rState.scope = b.dataset.v; re(); });
    root.querySelectorAll("[data-pg]").forEach(b => b.onclick = () => { rState.page = +b.dataset.pg; render(); window.scrollTo(0, 0); });
  } };
};

  ["2023", "Challengers South Asia runs under NODWIN Gaming with splits and open qualifiers. Orangutan X finish runner-up at Game Changers APAC Open 1."],
  ["2025", "Revenant XSpark win VCSA Split 2, sweeping Reckoning Esports 3–0 at the Mumbai LAN, and lead the circuit into the Ascension qualifiers."],
  ["2026", "Global Esports reach Masters London, win VCT Pacific Stage 2 and play Champions, then exit esports. India qualifies for the first Esports Nations Cup."],
];

/* ---------- router ---------- */
function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }
// View state lives in the URL (#players?role=Duelist&ageMax=21) so any filtered view can be shared.
const QS = { teams: [tState, T_DEF, "tstate2"], players: [pState, P_DEF, "pstate2"], circuit: [cState, C_DEF, "cstate"], events: [eState, E_DEF, "estate"],
  abroad: [aState, A_DEF], compare: [cmpState, CMP_DEF], h2h: [hState, H_DEF], results: [rState, R_DEF] };
function parseHash() {
  const h = decodeURI(location.hash || "#overview").slice(1); const qi = h.indexOf("?");
  const path = qi < 0 ? h : h.slice(0, qi), qs = qi < 0 ? "" : h.slice(qi + 1);
  const [name, id] = path.split(/-(.+)/); return { path, name, id, qs };
}
function applyQuery(st, def, qs) {
  for (const k of Object.keys(def)) st[k] = Array.isArray(def[k]) ? def[k].slice() : def[k];
  for (const [k, v] of new URLSearchParams(qs)) {
    if (!(k in def)) continue; const d = def[k];
    st[k] = Array.isArray(d) ? v.split(",").filter(Boolean) : typeof d === "number" ? (+v || 0) : typeof d === "boolean" ? (v === "true" || v === "1") : v;
  }
}
function toQuery(st, def) {
  return Object.keys(def).filter(k => JSON.stringify(st[k]) !== JSON.stringify(def[k]))
    .map(k => k + "=" + encodeURIComponent(Array.isArray(st[k]) ? st[k].join(",") : String(st[k])).replace(/%2C/g, ",")).join("&");
}
function onNav() {
  const { name, qs } = parseHash(); const q = QS[name];
  if (q && qs) applyQuery(q[0], q[1], qs);
  render();
}
function render() {
  let { path, name, id } = parseHash();
  if (!V[name]) { name = "overview"; path = "overview"; }
  document.querySelectorAll("#tabs a").forEach(a => a.classList.toggle("on", a.getAttribute("href") === "#" + (name === "team" ? "teams" : name === "player" ? "players" : name === "event" ? "events" : name)));
  const out = V[name](id);
  const root = $("#view");
  const y = window.scrollY;
  if (typeof out === "string") root.innerHTML = out; else { root.innerHTML = out.html; out.bind(root); }
  bindWidgets(root);
  const q = QS[name];
  if (q) {
    if (q[2]) store.set(q[2], q[0]);
    const qs = toQuery(q[0], q[1]); const want = "#" + path + (qs ? "?" + qs : "");
    if (decodeURI(location.hash) !== decodeURI(want)) history.replaceState(null, "", want);
  }
  const titles = { overview: "", teams: "Team rankings", players: "Players", abroad: "Indians abroad", compare: "Compare players", h2h: "Head-to-head", results: "Results", circuit: "Circuit tracker", events: "Tournaments", meta: "Meta", records: "Records", about: "Method",
    team: TEAM.get(+id)?.name, player: PLAYER.get(+id)?.name, event: EVENT.get(+id)?.title };
  document.title = (titles[name] ? titles[name] + " · " : "") + "Indian Valorant Index";
  if (render.last !== path) window.scrollTo(0, 0); else window.scrollTo(0, y);
  render.last = path;
}
window.addEventListener("hashchange", onNav);

/* search */
const SEARCH = [...D.teams.filter(t => t.series[0] + t.series[1] > 0).map(t => ({ k: "t", id: t.id, n: t.name, s: (t.name + " " + (t.tag || "")).toLowerCase(), sub: t.indian ? "Team" : "Team · " + (t.country || ""),
    w: (t.indian ? 2 : 0) + (t.active ? 3 : 0) + Math.log1p(t.series[0] + t.series[1]) })),
  ...D.players.map(p => ({ k: "p", id: p.id, n: p.name, s: (p.name + " " + (p.real || "")).toLowerCase(), sub: tname(p.team),
    w: (p.active ? 3 : 0) + (p.flag === "in" ? 1 : 0) + Math.log1p(p.career.maps) }))];
$("#q").addEventListener("input", debounce(e => {
  const q = e.target.value.trim().toLowerCase(); const box = $("#qres");
  if (q.length < 2) { box.hidden = true; return; }
  box.innerHTML = searchHits(q).map(x => hitHTML(x, `href="#${x.k === "t" ? "team" : "player"}-${x.id}"`)).join("") || `<div class="empty">No match</div>`;
  box.hidden = false;
}, 150));
$("#q").addEventListener("keydown", e => keyNav(e, $("#qres"), a => { location.hash = a.getAttribute("href"); $("#qres").hidden = true; $("#q").value = ""; $("#q").blur(); }));
document.addEventListener("keydown", e => {
  if (e.key === "/" && !/^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement?.tagName || "")) { e.preventDefault(); $("#q").focus(); }
});
document.addEventListener("click", e => { if (!e.target.closest(".search")) $("#qres").hidden = true; if (!e.target.closest(".colpick")) { const m = $("#pcolmenu"); if (m) m.hidden = true; } });
$("#qres").addEventListener("click", () => { $("#qres").hidden = true; $("#q").value = ""; });

/* theme */
const themeBtn = $("#themebtn");
function applyTheme(t) { if (t) document.documentElement.setAttribute("data-theme", t); else document.documentElement.removeAttribute("data-theme"); themeBtn.textContent = t === "light" ? "Light" : t === "dark" ? "Dark" : "Auto"; }
let theme = store.get("theme", null); applyTheme(theme);
themeBtn.onclick = () => { theme = theme === null ? "light" : theme === "light" ? "dark" : null; store.set("theme", theme); applyTheme(theme); };

$("#asof").textContent = "data to " + D.generated;
$("#foot").innerHTML = `Built from VLR.gg match data and Liquipedia (CC BY-SA) player bios and some team logos · snapshot ${esc(D.generated)} · ${D.matches.length.toLocaleString()} series · ${D.players.length.toLocaleString()} players · ${D.teams.length.toLocaleString()} teams. Not affiliated with Riot Games. · <a href="https://github.com/alan-r-henry/indian-valorant-index" target="_blank" rel="noopener">Source on GitHub</a>`;
onNav();
</script>
