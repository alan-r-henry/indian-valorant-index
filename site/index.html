<title>Indian Valorant Index</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: sticky command bar + one routed view; dense data tables in scroll wells; profiles as full views. */
:root {
  --bg: #0e1016;
  --panel: #151821;
  --panel2: #1b1f2b;
  --line: #272c3a;
  --fg: #e9e7e1;
  --muted: #8d92a3;
  --accent: #f0a63a;        /* marigold */
  --accent-ink: #1a1206;
  --accent-soft: rgba(240,166,58,.14);
  --pos: #3fbf9f;
  --neg: #e8615a;
  --info: #7aa7ff;
  --gold: #f4c95d; --silver: #c9ced8; --bronze: #d38b5d;
  --display: "Rajdhani", "Arial Narrow", system-ui, sans-serif;
  --body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
  --bg: #f3f4f7; --panel: #ffffff; --panel2: #eef0f5; --line: #dde0e8; --fg: #161923; --muted: #5d6476;
  --accent: #b86e07; --accent-ink: #ffffff; --accent-soft: rgba(184,110,7,.12);
  --pos: #11876b; --neg: #c33b33; --info: #2f62d0; --gold: #b8860b; --silver: #7c8594; --bronze: #a0582c; color-scheme: light; } }
:root[data-theme="light"] {
  --bg: #f3f4f7; --panel: #ffffff; --panel2: #eef0f5; --line: #dde0e8; --fg: #161923; --muted: #5d6476;
  --accent: #b86e07; --accent-ink: #ffffff; --accent-soft: rgba(184,110,7,.12);
  --pos: #11876b; --neg: #c33b33; --info: #2f62d0; --gold: #b8860b; --silver: #7c8594; --bronze: #a0582c; color-scheme: light; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 14px; line-height: 1.45; margin: 0; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--panel); }
a { color: inherit; text-decoration: none; }
a:hover { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num, td.n, th.n { font-variant-numeric: tabular-nums; }
.wrap { max-width: 1320px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* top bar */
header.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--panel); border-bottom: 1px solid var(--line); }
.bar .wrap { display: flex; align-items: center; gap: 18px; padding-block: 10px; flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: 10px; font-family: var(--display); font-weight: 700; font-size: 22px; letter-spacing: .02em; white-space: nowrap; }
.brand .mark { width: 18px; height: 18px; background: var(--accent); clip-path: polygon(0 0, 100% 0, 100% 62%, 62% 100%, 0 100%); align-self: center; }
.brand small { font-family: var(--body); font-weight: 500; font-size: 11px; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }
nav.tabs { display: flex; gap: 2px; overflow-x: auto; flex: 1; min-width: 0; scrollbar-width: none; }
nav.tabs a { font-family: var(--display); font-weight: 600; font-size: 15px; letter-spacing: .04em; text-transform: uppercase; padding: 6px 11px; color: var(--muted); white-space: nowrap; border-bottom: 2px solid transparent; }
nav.tabs a.on { color: var(--fg); border-bottom-color: var(--accent); }
.search { position: relative; }
.search input { background: var(--panel2); border: 1px solid var(--line); color: var(--fg); padding: 7px 10px; width: 210px; font: inherit; border-radius: 3px; }
.search .res { position: absolute; right: 0; top: 100%; margin-top: 4px; width: 300px; max-height: 360px; overflow: auto; background: var(--panel); border: 1px solid var(--line); z-index: 40; box-shadow: 0 10px 30px rgba(0,0,0,.35); }
.search .res a { display: flex; gap: 8px; padding: 7px 10px; align-items: center; border-bottom: 1px solid var(--line); }
.search .res a small { color: var(--muted); margin-left: auto; }
.themebtn { background: none; border: 1px solid var(--line); color: var(--muted); padding: 6px 9px; border-radius: 3px; cursor: pointer; font: inherit; }

main { padding-block: 22px 60px; }
h1, h2, h3 { font-family: var(--display); font-weight: 700; letter-spacing: .01em; text-wrap: balance; margin: 0; }
h1 { font-size: 34px; line-height: 1.05; }
h2 { font-size: 22px; text-transform: uppercase; letter-spacing: .04em; }
h3 { font-size: 17px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.eyebrow { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.lede { color: var(--muted); max-width: 70ch; margin: 6px 0 0; }
.sec { margin-top: 28px; display: grid; gap: 12px; }
.sec-head { display: flex; align-items: end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.grid { display: grid; gap: 16px; }
.g2 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); }
.g3 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); }
.g4 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 14px 16px; min-width: 0; }
.panel.flush { padding: 0; }
.panel > h3 { margin-bottom: 10px; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.pill { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; letter-spacing: .04em; padding: 1px 7px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.pill.acc { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
.pill.pos { color: var(--pos); border-color: color-mix(in srgb, var(--pos) 50%, transparent); }
.pill.neg { color: var(--neg); border-color: color-mix(in srgb, var(--neg) 50%, transparent); }
.tier { font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: 2px 6px; border-radius: 2px; background: var(--panel2); color: var(--muted); white-space: nowrap; }
.tier.international { background: var(--accent); color: var(--accent-ink); }
.tier.vct_pacific { background: color-mix(in srgb, var(--accent) 35%, var(--panel2)); color: var(--fg); }
.tier.ascension { background: color-mix(in srgb, var(--info) 30%, var(--panel2)); color: var(--fg); }
.tier.challengers { background: color-mix(in srgb, var(--pos) 25%, var(--panel2)); color: var(--fg); }
.tier.gc { background: color-mix(in srgb, #c86bd6 30%, var(--panel2)); color: var(--fg); }
.tier.national { background: color-mix(in srgb, #ff8a3d 30%, var(--panel2)); color: var(--fg); }

/* stat tiles */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 150px), 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
.tile { background: var(--panel); padding: 12px 14px; min-width: 0; }
.tile b { display: block; font-family: var(--display); font-size: 28px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.tile span { font-size: 11px; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }

/* tables */
.tw { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { padding: 7px 9px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-size: 11px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); font-weight: 600; position: sticky; top: 0; background: var(--panel); cursor: pointer; user-select: none; }
th.n, td.n { text-align: right; }
th.sorted { color: var(--accent); }
th .arr { font-size: 9px; }
tbody tr:hover { background: var(--panel2); }
td.rank { font-family: var(--display); font-weight: 700; font-size: 16px; color: var(--muted); width: 36px; }
tr.top3 td.rank { color: var(--accent); }
.tlink { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; }
.logo { width: 22px; height: 22px; object-fit: contain; flex: none; }
.logo.lg { width: 64px; height: 64px; }
.flag { font-size: 11px; color: var(--muted); font-weight: 600; letter-spacing: .05em; }
.form { display: inline-flex; gap: 2px; }
.form i { width: 7px; height: 14px; display: inline-block; border-radius: 1px; }
.form i.W { background: var(--pos); } .form i.L { background: var(--neg); opacity: .8; }
.bar-cell { display: inline-block; height: 6px; background: var(--accent); border-radius: 1px; vertical-align: middle; }
.heat { border-radius: 2px; padding: 2px 6px; }

/* filters */
.filters { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: end; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 12px 14px; }
.filters label { display: grid; gap: 4px; font-size: 11px; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; font-weight: 600; }
.filters select, .filters input[type=number], .filters input[type=text] { background: var(--panel2); color: var(--fg); border: 1px solid var(--line); padding: 6px 8px; font: inherit; font-size: 13px; border-radius: 3px; min-width: 0; }
.filters input[type=number] { width: 72px; }
.seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--line); border-radius: 3px; overflow: hidden; max-width: 100%; }
.seg button { background: var(--panel2); color: var(--muted); border: 0; padding: 6px 10px; font: inherit; font-size: 12px; font-weight: 600; cursor: pointer; border-right: 1px solid var(--line); }
.seg button:last-child { border-right: 0; }
.seg button.on { background: var(--accent); color: var(--accent-ink); }
.chk { display: inline-flex !important; grid-auto-flow: column; align-items: center; gap: 6px !important; text-transform: none !important; letter-spacing: 0 !important; font-size: 13px !important; color: var(--fg) !important; font-weight: 500 !important; }
.count { font-size: 12px; color: var(--muted); margin-left: auto; align-self: center; }
.colpick { position: relative; }
.colpick .menu { position: absolute; top: 100%; right: 0; z-index: 15; background: var(--panel); border: 1px solid var(--line); padding: 8px 10px; display: grid; gap: 4px; width: 220px; box-shadow: 0 10px 30px rgba(0,0,0,.3); }

/* profile header */
.phead { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
.phead .who { min-width: 0; flex: 1; }
.phead .meta { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 6px 14px; font-size: 13px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; }
.back { font-size: 12px; color: var(--muted); display: inline-block; margin-bottom: 10px; }

/* percentile bars */
.pct { display: grid; grid-template-columns: 110px 1fr 54px; gap: 8px; align-items: center; font-size: 12px; }
.pct .track { height: 8px; background: var(--panel2); border-radius: 2px; position: relative; overflow: hidden; }
.pct .fill { position: absolute; inset: 0 auto 0 0; background: var(--accent); }
.pct .v { text-align: right; font-variant-numeric: tabular-nums; }

/* match list */
.mrow { display: grid; grid-template-columns: 82px 1fr auto 1fr; gap: 10px; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--line); font-size: 13px; }
.mrow .t2 { text-align: right; justify-self: end; }
.mrow .sc { font-family: var(--display); font-weight: 700; font-size: 17px; font-variant-numeric: tabular-nums; min-width: 48px; text-align: center; }
.mrow .ev { grid-column: 1 / -1; font-size: 11px; color: var(--muted); margin-top: -4px; }
.win { color: var(--pos); } .loss { color: var(--neg); }

/* story cards */
.story { border-left: 3px solid var(--accent); padding: 4px 0 4px 12px; }
.story b { font-family: var(--display); font-size: 17px; display: block; }
.story p { margin: 3px 0 0; color: var(--muted); max-width: 65ch; }
.timeline { display: grid; gap: 0; }
.tl { display: grid; grid-template-columns: 74px 1fr; gap: 12px; padding: 8px 0; border-bottom: 1px dashed var(--line); }
.tl .y { font-family: var(--display); font-weight: 700; color: var(--accent); font-size: 16px; }

svg text { fill: var(--muted); font-size: 10px; font-family: var(--body); }
.chart-line { fill: none; stroke: var(--accent); stroke-width: 2; }
.chart-area { fill: var(--accent-soft); }
.chart-grid { stroke: var(--line); stroke-width: 1; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.empty { padding: 24px; text-align: center; color: var(--muted); }
.note { font-size: 12px; color: var(--muted); max-width: 80ch; }
.matrix td { text-align: center; font-size: 12px; }
.matrix td:first-child { text-align: left; }
.stage { display: inline-block; min-width: 34px; padding: 2px 5px; border-radius: 2px; font-weight: 600; font-size: 11px; }
footer { border-top: 1px solid var(--line); padding-block: 18px; color: var(--muted); font-size: 12px; }
@media (max-width: 640px) {
  h1 { font-size: 27px; }
  .brand small { display: none; }
  nav.tabs { order: 3; flex-basis: 100%; }
  .search { order: 4; flex-basis: 100%; }
  .search input { width: 100%; }
  .search .res { width: 100%; }
  .themebtn#themebtn { margin-left: auto; }
  .mrow { grid-template-columns: 1fr auto 1fr; }
  .mrow .dt { grid-column: 1 / -1; font-size: 11px; color: var(--muted); }
  .pct { grid-template-columns: 90px 1fr 48px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<script>
"use strict";
const D = window.IVI_DATA;
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = (v, d = 2) => v == null || isNaN(v) ? "–" : (+v).toFixed(d);
const pct = (v, d = 0) => v == null || isNaN(v) ? "–" : (v * 100).toFixed(d) + "%";
const pctRaw = (v, d = 0) => v == null || isNaN(v) ? "–" : (+v).toFixed(d) + "%";
const sgn = v => (v > 0 ? "+" : "") + v;
const img = u => u ? (u.startsWith("//") ? "https:" + u : (u.startsWith("/") ? "https://www.vlr.gg" + u : u)) : "";
const NOW = new Date(D.generated + "T00:00:00");
const daysAgo = d => Math.round((NOW - new Date(d + "T00:00:00")) / 864e5);
const store = { get(k, d) { try { const v = localStorage.getItem("ivi_" + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem("ivi_" + k, JSON.stringify(v)); } catch (e) {} } };

const TEAM = new Map(D.teams.map(t => [t.id, t]));
const PLAYER = new Map(D.players.map(p => [p.id, p]));
const EVENT = new Map(D.events.map(e => [e.id, e]));
const MATCH = new Map(D.matches.map(m => [m.id, m]));
const tname = id => TEAM.get(id)?.name || D.names[id] || "Team " + id;
const tlogo = id => img(TEAM.get(id)?.logo || D.tlogos[id] || "");
const TIER_ORDER = ["international", "vct_pacific", "ascension", "challengers", "national", "gc", "third_party"];
const TIER_LABEL = { international: "International", vct_pacific: "VCT Pacific", ascension: "Ascension / LCQ", challengers: "Challengers SA", national: "National team", gc: "Game Changers", third_party: "Cups & leagues" };
const ROLE_COLORS = { Duelist: "#e8615a", Initiator: "#3fbf9f", Controller: "#7aa7ff", Sentinel: "#f0a63a", Flex: "#a58bd8" };
const AG = a => a ? a.charAt(0).toUpperCase() + a.slice(1).replace("kayo", "KAY/O") : "–";
const agName = a => a === "kayo" ? "KAY/O" : AG(a);

function teamLink(id, withLogo = true) {
  const t = TEAM.get(id), nm = esc(tname(id)), lg = tlogo(id);
  const inner = (withLogo && lg ? `<img class="logo" src="${lg}" alt="" loading="lazy">` : "") + `<span>${nm}</span>`;
  return t ? `<a class="tlink" href="#team-${id}">${inner}</a>` : `<span class="tlink">${inner}</span>`;
}
function playerLink(id) { const p = PLAYER.get(id); return p ? `<a href="#player-${id}"><b>${esc(p.name)}</b></a>` : "–"; }
function formBar(f) { return `<span class="form" aria-label="Recent form ${f.join("")}">${f.slice(-8).map(x => `<i class="${x}"></i>`).join("")}</span>`; }
function tierTag(t) { return `<span class="tier ${t}">${TIER_LABEL[t] || t}</span>`; }

/* ---------- derived ---------- */
const INDIAN = D.teams.filter(t => t.indian);
function teamPool(opts) {
  const win = opts.win || "now";
  const since = win === "now" ? isoAgo(365) : win === "2026" ? "2026-01-01" : win === "2y" ? isoAgo(730) : "0000";
  return D.teams.filter(t => (opts.scope === "sa" ? true : t.indian) && !!t.gc === (opts.circ === "gc") && t.last && t.last >= since && (win !== "now" || !t.inactive)
    && (win === "2026" ? (t.y["2026"] ? t.y["2026"].series[0] + t.y["2026"].series[1] : 0) : t.series[0] + t.series[1]) >= (opts.minSeries ?? 1));
}
function isoAgo(days) { return new Date(NOW - days * 864e5).toISOString().slice(0, 10); }
function rankTeams(list) { return list.slice().sort((a, b) => b.rating - a.rating); }
const RANKED = rankTeams(teamPool({ scope: "in", win: "now", circ: "open" }));
const RANKED_GC = rankTeams(teamPool({ scope: "in", win: "now", circ: "gc" }));
RANKED.forEach((t, i) => t.rank = i + 1);
function ratingAgo(t, days) {
  const cut = new Date(NOW - days * 864e5).toISOString().slice(0, 7);
  let r = null; for (const [m, v] of t.hist) { if (m <= cut) r = v; }
  return r;
}
function seasonDelta(t) {
  let before = null, last = null;
  for (const [m, v] of t.hist) { if (m < "2026-01") before = v; last = v; }
  return before == null || !t.last || t.last < "2026" ? null : t.elo - before;
}
function bestMap(t) {
  let best = null;
  for (const [m, s] of Object.entries(t.mapstats)) { if (s.p >= 4 && m !== "?" && (!best || s.w / s.p > best[1])) best = [m, s.w / s.p, s.p]; }
  return best;
}

/* ---------- charts ---------- */
function lineChart(points, { w = 640, h = 180, yfmt = v => Math.round(v), label = "" } = {}) {
  if (!points.length) return `<div class="empty">No history yet</div>`;
  const pad = { l: 38, r: 10, t: 10, b: 22 };
  const ys = points.map(p => p[1]); let mn = Math.min(...ys), mx = Math.max(...ys);
  if (mx - mn < 40) { mn -= 20; mx += 20; }
  const x = i => pad.l + (points.length === 1 ? (w - pad.l - pad.r) / 2 : i * (w - pad.l - pad.r) / (points.length - 1));
  const y = v => pad.t + (mx - v) * (h - pad.t - pad.b) / (mx - mn);
  const ticks = 4, grid = [];
  for (let i = 0; i <= ticks; i++) { const v = mn + (mx - mn) * i / ticks; grid.push(`<line class="chart-grid" x1="${pad.l}" x2="${w - pad.r}" y1="${y(v)}" y2="${y(v)}"/><text x="${pad.l - 6}" y="${y(v) + 3}" text-anchor="end">${yfmt(v)}</text>`); }
  const d = points.map((p, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(p[1]).toFixed(1)}`).join("");
  const area = d + `L${x(points.length - 1)},${h - pad.b}L${x(0)},${h - pad.b}Z`;
  const step = Math.max(1, Math.ceil(points.length / 8));
  const xl = points.map((p, i) => i % step === 0 || i === points.length - 1 ? `<text x="${x(i)}" y="${h - 6}" text-anchor="middle">${esc(p[0])}</text>` : "").join("");
  const last = points[points.length - 1];
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" role="img" aria-label="${esc(label)}">${grid.join("")}<path class="chart-area" d="${area}"/><path class="chart-line" d="${d}"/><circle cx="${x(points.length - 1)}" cy="${y(last[1])}" r="3.5" fill="var(--accent)"/>${xl}</svg>`;
}
function spark(points, w = 90, h = 24) {
  if (!points || points.length < 2) return "";
  const ys = points.map(p => p[1]); const mn = Math.min(...ys), mx = Math.max(...ys) || 1, rg = (mx - mn) || 1;
  const d = points.map((p, i) => `${i ? "L" : "M"}${(i * w / (points.length - 1)).toFixed(1)},${(h - 2 - (p[1] - mn) * (h - 4) / rg).toFixed(1)}`).join("");
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><path d="${d}" fill="none" stroke="var(--accent)" stroke-width="1.5"/></svg>`;
}
function multiLine(series, months, { w = 760, h = 240, yfmt = v => (v * 100).toFixed(0) + "%" } = {}) {
  const pad = { l: 40, r: 10, t: 10, b: 22 };
  const all = series.flatMap(s => s.v); const mx = Math.max(...all, 0.01);
  const x = i => pad.l + i * (w - pad.l - pad.r) / Math.max(1, months.length - 1);
  const y = v => pad.t + (mx - v) * (h - pad.t - pad.b) / mx;
  let g = ""; for (let i = 0; i <= 4; i++) { const v = mx * i / 4; g += `<line class="chart-grid" x1="${pad.l}" x2="${w - pad.r}" y1="${y(v)}" y2="${y(v)}"/><text x="${pad.l - 6}" y="${y(v) + 3}" text-anchor="end">${yfmt(v)}</text>`; }
  const step = Math.max(1, Math.ceil(months.length / 9));
  const xl = months.map((m, i) => i % step === 0 ? `<text x="${x(i)}" y="${h - 6}" text-anchor="middle">${m}</text>` : "").join("");
  const lines = series.map(s => `<path d="${s.v.map((v, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join("")}" fill="none" stroke="${s.c}" stroke-width="2"/>`).join("");
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" role="img" aria-label="Pick rate over time">${g}${lines}${xl}</svg>`;
}

/* ---------- sortable table helper ---------- */
function table(id, cols, rows, state, opts = {}) {
  const key = state.sort, dir = state.dir;
  const col = cols.find(c => c.k === key) || cols[0];
  const sorted = rows.slice().sort((a, b) => {
    const va = col.v(a), vb = col.v(b);
    const na = va == null || (typeof va === "number" && isNaN(va)), nb = vb == null || (typeof vb === "number" && isNaN(vb));
    if (na && nb) return 0; if (na) return 1; if (nb) return -1;
    return (va > vb ? 1 : va < vb ? -1 : 0) * dir;
  });
  const lim = opts.limit ? sorted.slice(0, opts.limit) : sorted;
  const head = cols.map(c => `<th class="${c.n ? "n" : ""} ${c.k === key ? "sorted" : ""}" data-k="${c.k}" title="${esc(c.t || c.h)}">${c.h}${c.k === key ? ` <span class="arr">${dir < 0 ? "▼" : "▲"}</span>` : ""}</th>`).join("");
  const body = lim.map((r, i) => `<tr class="${i < 3 && opts.rankCol ? "top3" : ""}">${cols.map(c => `<td class="${c.n ? "n" : ""} ${c.cls || ""}">${c.f ? c.f(r, i) : esc(c.v(r))}</td>`).join("")}</tr>`).join("");
  return `<div class="tw"><table id="${id}"><thead><tr>${head}</tr></thead><tbody>${body || `<tr><td colspan="${cols.length}" class="empty">Nothing matches these filters</td></tr>`}</tbody></table></div>`;
}
function bindSort(root, state, rerender, defDir = {}) {
  root.querySelectorAll("th[data-k]").forEach(th => th.onclick = () => {
    const k = th.dataset.k;
    if (state.sort === k) state.dir *= -1; else { state.sort = k; state.dir = defDir[k] ?? -1; }
    rerender();
  });
}

/* ---- Circuit tracker ---- */
const STAGE_RANK = [
  [/grand final|^final|final stage/i, 7, "Final"], [/playoff|upper|lower|semifinal|knockout/i, 6, "Playoffs"],
  [/group|league|regular|round robin|swiss|main event|chapter/i, 5, "Main"], [/qualifier playoffs|qualifier #?\d? ?playoff/i, 4, "Q-Playoffs"],
  [/last chance/i, 3, "OQ-LC"], [/open qualifier|qualifier/i, 2, "OQ"], [/promotion|relegation/i, 4, "Promo/Rel"],
];
function stageOf(stages) {
  let best = [0, "–"];
  for (const s of stages) for (const [re, r, lab] of STAGE_RANK) if (re.test(s)) { if (r > best[0]) best = [r, lab]; break; }
  return best;
}
const cState = Object.assign({ tier: "challengers", years: "2025-2026" }, store.get("cstate", {}));
V.circuit = () => {
  const tiers = ["challengers", "ascension", "vct_pacific", "international", "gc", "national", "third_party"];
  const evs = D.events.filter(e => e.tier === cState.tier && (cState.years === "all" || cState.years.split("-").some(y => e.start.startsWith(y)) || (cState.years === "2025-2026" && e.start >= "2025"))).sort((a, b) => a.start.localeCompare(b.start));
  const evIds = new Set(evs.map(e => e.id));
  const rows = new Map();
  for (const t of D.teams) {
    if (!t.indian) continue;
    for (const e of t.events) if (evIds.has(e.e)) { if (!rows.has(t.id)) rows.set(t.id, {}); rows.get(t.id)[e.e] = e; }
  }
  const scoreTeam = id => { const r = rows.get(id); let s = 0; for (const e of Object.values(r)) { const st = stageOf(e.st); s += st[0] * 10 + (e.place && /^1/.test(e.place) ? 30 : e.place && /^2/.test(e.place) ? 20 : 0) + e.w; } return s; };
  const teamIds = [...rows.keys()].sort((a, b) => scoreTeam(b) - scoreTeam(a)).slice(0, 150);
  const cell = e => {
    if (!e) return `<td class="muted">·</td>`;
    const st = stageOf(e.st); const place = e.place ? e.place.replace(/(st|nd|rd|th)/g, "") : "";
    const strong = place ? (/^1$/.test(place) ? "var(--gold)" : /^2$/.test(place) ? "var(--silver)" : /^3/.test(place) ? "var(--bronze)" : "var(--accent)") : null;
    const bg = strong ? `background:color-mix(in srgb, ${strong} 30%, transparent)` : `background:color-mix(in srgb, var(--accent) ${st[0] * 5}%, transparent)`;
    return `<td title="${esc(e.st.join(" → "))} · series ${e.w}-${e.l} · maps ${e.mw}-${e.ml}"><span class="stage" style="${bg}">${place ? esc(place) : st[1]}</span><div class="small muted">${e.w}-${e.l}</div></td>`;
  };
  const html = `
  <div class="sec-head"><div><div class="eyebrow">Circuit tracker</div><h1>How Indian teams fare, event by event</h1>
  <p class="lede">Each cell is a team's deepest stage in that event (OQ = open qualifier, OQ-LC = last-chance open qualifier, Q-Playoffs, Main, Playoffs, Final) or its final placing where VLR records one, with series W–L below. Hover a cell for the full path.</p></div></div>
  <div class="sec filters">
    <label>Circuit<span class="seg" id="ctier">${tiers.map(t => `<button type="button" data-v="${t}" class="${cState.tier === t ? "on" : ""}">${TIER_LABEL[t]}</button>`).join("")}</span></label>
    <label>Years<span class="seg" id="cyrs">${["2025-2026", "2026", "2025", "2024", "2023", "all"].map(y => `<button type="button" data-v="${y}" class="${cState.years === y ? "on" : ""}">${y === "all" ? "All" : y.replace("-", "–")}</button>`).join("")}</span></label>
    <span class="count">${evs.length} events · ${teamIds.length} teams</span>
  </div>
  <div class="sec panel flush"><div class="tw"><table class="matrix"><thead><tr><th>Team</th>${evs.map(e => `<th title="${esc(e.title)}"><a href="#event-${e.id}">${esc(shortEv(e.title))}</a><div class="small muted" style="text-transform:none;letter-spacing:0">${e.start.slice(0, 7)}</div></th>`).join("")}</tr></thead>
  <tbody>${teamIds.map(id => `<tr><td>${teamLink(id)}</td>${evs.map(e => cell(rows.get(id)[e.id])).join("")}</tr>`).join("") || `<tr><td class="empty">No Indian teams recorded in this circuit for these years</td></tr>`}</tbody></table></div></div>
  ${intlSummary()}`;
  return { html, bind(root) {
    root.querySelectorAll("#ctier button").forEach(b => b.onclick = () => { cState.tier = b.dataset.v; store.set("cstate", cState); render(); });
    root.querySelectorAll("#cyrs button").forEach(b => b.onclick = () => { cState.years = b.dataset.v; store.set("cstate", cState); render(); });
  } };
};
function shortEv(t) {
  return t.replace(/Challengers League/i, "VCL").replace(/Challengers/i, "VCL").replace(/Champions Tour/i, "VCT").replace(/Game Changers/i, "GC").replace(/South Asia/i, "SA").replace(/Open Qualifier/i, "OQ").replace(/Southeast Asia/i, "SEA").replace(/: /g, " ").slice(0, 34);
}
function intlSummary() {
  const tiers = ["international", "vct_pacific", "ascension"];

  <div class="tw"><table><thead><tr><th>Date</th><th>Team</th><th>Event</th><th>Circuit</th><th class="n">Series</th><th class="n">Maps</th><th>Result</th></tr></thead><tbody>

function placeNum(p) { const m = /^(\d+)/.exec(p || ""); return m ? +m[1] : 999; }
function bestIndian(e) {
  let best = null;
  for (const [tid, place, w, l] of e.ind) {
    const t = TEAM.get(tid); if (!t) continue;
    const ev = t.events.find(x => x.e === e.id); const st = ev ? stageOf(ev.st) : [0, "–"];
    const score = place ? 1000 - placeNum(place) : st[0] * 10 + w;
    if (!best || score > best[2]) best = [tid, place ? place : st[1] + ` (${w}-${l})`, score];
  }
  return best;
}

/* ---- Meta ---- */
V.meta = () => {
  const months = Object.keys(D.agent_month).filter(m => m >= "2024-01");
  const tot = months.map(m => Object.values(D.agent_month[m]).reduce((a, b) => a + b, 0));
  const totals = {}; months.slice(-6).forEach(m => { for (const [a, n] of Object.entries(D.agent_month[m])) totals[a] = (totals[a] || 0) + n; });
  const topAgents = Object.entries(totals).sort((a, b) => b[1] - a[1]).slice(0, 8).map(x => x[0]);
  // 3-month rolling share of team compositions: each composition has 5 agents
  const series = topAgents.map((a, i) => ({ a, c: PALETTE[i], v: months.map((m, j) => { let n = 0, t = 0; for (let k = Math.max(0, j - 2); k <= j; k++) { n += D.agent_month[months[k]][a] || 0; t += tot[k]; } return t ? n / (t / 5) : 0; }) }));
  const recentPicks = Object.entries(totals).sort((a, b) => b[1] - a[1]);
  const recentTotal = recentPicks.reduce((s, x) => s + x[1], 0) / 5;
  const mapTot = {}; Object.entries(D.map_month).filter(([m]) => m >= months[Math.max(0, months.length - 12)]).forEach(([, o]) => { for (const [k, v] of Object.entries(o)) if (k && k !== "null") mapTot[k] = (mapTot[k] || 0) + v; });
  const mapsSorted = Object.entries(mapTot).sort((a, b) => b[1] - a[1]);
  const mx = mapsSorted[0]?.[1] || 1;
  const sides = Object.entries(D.map_side).filter(([m, v]) => v[2] >= 20).map(([m, v]) => [m, v[0] / (v[0] + v[1]), v[2]]).sort((a, b) => b[1] - a[1]);
  const roleShare = {}; for (const [a, n] of recentPicks) { const r = D.agent_role[a] || "?"; roleShare[r] = (roleShare[r] || 0) + n; }
  return `
  <div class="sec-head"><div><div class="eyebrow">Meta</div><h1>What Indian teams pick</h1><p class="lede">Agent and map trends across every map involving an Indian team. Pick rate is the share of team compositions that included the agent (three-month rolling average in the chart).</p></div></div>
  <div class="sec panel"><h3>Agent pick rate, top 8 of the last six months</h3><div class="legend" style="margin-bottom:8px">${series.map(s => `<span><i style="background:${s.c}"></i>${agName(s.a)}</span>`).join("")}</div>${multiLine(series, months)}</div>
  <div class="sec grid g3">
    <div class="panel flush"><div style="padding:14px 16px 6px"><h3>Agents · last six months</h3></div><div class="tw"><table><thead><tr><th>Agent</th><th>Role</th><th class="n">Pick rate</th><th></th></tr></thead><tbody>
    ${recentPicks.slice(0, 22).map(([a, n]) => `<tr><td><b>${agName(a)}</b></td><td class="small" style="color:${ROLE_COLORS[D.agent_role[a]] || "inherit"}">${D.agent_role[a] || "?"}</td><td class="n">${pct(n / recentTotal)}</td><td><span class="bar-cell" style="width:${Math.round(80 * n / recentPicks[0][1])}px"></span></td></tr>`).join("")}
    </tbody></table></div></div>
    <div class="panel flush"><div style="padding:14px 16px 6px"><h3>Maps played · last 12 months</h3></div><div class="tw"><table><thead><tr><th>Map</th><th class="n">Maps</th><th></th></tr></thead><tbody>
    ${mapsSorted.map(([m, n]) => `<tr><td><b>${esc(m)}</b></td><td class="n">${n}</td><td><span class="bar-cell" style="width:${Math.round(110 * n / mx)}px"></span></td></tr>`).join("")}
    </tbody></table></div></div>
    <div class="panel flush"><div style="padding:14px 16px 6px"><h3>Attack-side round win %</h3><p class="note">All recorded maps, minimum 20.</p></div><div class="tw"><table><thead><tr><th>Map</th><th class="n">Atk</th><th class="n">Def</th><th class="n">Maps</th></tr></thead><tbody>
    ${sides.map(([m, a, n]) => `<tr><td><b>${esc(m)}</b></td><td class="n ${a > .5 ? "win" : ""}">${pct(a, 1)}</td><td class="n ${a < .5 ? "win" : ""}">${pct(1 - a, 1)}</td><td class="n">${n}</td></tr>`).join("")}
    </tbody></table></div></div>
  </div>
  <div class="sec panel"><h3>Role mix of picks · last six months</h3><div class="grid g4">${Object.entries(roleShare).filter(([r]) => r !== "?").sort((a, b) => b[1] - a[1]).map(([r, n]) => `<div><div class="small muted">${r}</div><div style="font-family:var(--display);font-size:26px;font-weight:700;color:${ROLE_COLORS[r]}">${pct(n / (recentTotal * 5), 1)}</div></div>`).join("")}</div></div>`;
};

/* ---- Player profile ---- */
function percentile(p, key, pool, lowerBetter) {
  const vals = pool.map(x => x.cur?.[key]).filter(v => v != null).sort((a, b) => a - b);
  const v = p.cur?.[key]; if (v == null || !vals.length) return null;
  let i = 0; while (i < vals.length && vals[i] <= v) i++;
  const r = i / vals.length; return lowerBetter ? 1 - r : r;
}

    ${e.places.map(p => `<tr><td><b>${esc(p.place.replace(/ /g, ""))}</b></td><td>${p.team_id ? teamLink(p.team_id) : esc(p.team)}</td><td class="n small">${esc(p.prize)}</td><td class="small muted">${esc(p.note)}</td></tr>`).join("") || `<tr><td colspan="4" class="empty">VLR has no placement table for this event</td></tr>`}
    </tbody></table></div></div>
    <div class="panel flush"><div style="padding:14px 16px 6px"><h3>South Asian teams in this event</h3></div><div class="tw"><table><thead><tr><th>Team</th><th>Reached</th><th class="n">Series</th><th class="n">Maps</th></tr></thead><tbody>
    ${teamRes.map(([t, x]) => `<tr><td>${teamLink(t.id)}</td><td class="small">${x.place ? `<b>${esc(x.place)}</b>` : esc(stageOf(x.st)[1])} <span class="muted">${esc(x.last)}</span></td><td class="n">${x.w}–${x.l}</td><td class="n">${x.mw}–${x.ml}</td></tr>`).join("")}
    </tbody></table></div></div>
  </div>
  <div class="sec panel flush"><div style="padding:14px 16px 6px"><h3>Series (${ms.length})</h3></div>${ms.map(matchRow).join("")}</div>`;
};

/* ---------- router ---------- */
function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }
function render() {
  const h = (location.hash || "#overview").slice(1);
  let [name, id] = h.split(/-(.+)/);
  if (!V[name]) name = "overview";
  document.querySelectorAll("#tabs a").forEach(a => a.classList.toggle("on", a.getAttribute("href") === "#" + (name === "team" ? "teams" : name === "player" ? "players" : name === "event" ? "events" : name)));
  const out = V[name](id);
  const root = $("#view");
  const y = window.scrollY;
  if (typeof out === "string") root.innerHTML = out; else { root.innerHTML = out.html; out.bind(root); }
  if (render.last !== h) window.scrollTo(0, 0); else window.scrollTo(0, y);
  render.last = h;
}
window.addEventListener("hashchange", render);

/* search */
const SEARCH = [...D.teams.filter(t => t.series[0] + t.series[1] > 0).map(t => ({ k: "t", id: t.id, n: t.name, s: (t.name + " " + (t.tag || "")).toLowerCase(), sub: t.indian ? "Team" : "Team · " + (t.country || "") })),
  ...D.players.map(p => ({ k: "p", id: p.id, n: p.name, s: (p.name + " " + (p.real || "")).toLowerCase(), sub: tname(p.team) }))];
$("#q").addEventListener("input", debounce(e => {
  const q = e.target.value.trim().toLowerCase(); const box = $("#qres");
  if (q.length < 2) { box.hidden = true; return; }
  const hits = SEARCH.filter(x => x.s.includes(q)).sort((a, b) => (a.s.startsWith(q) ? 0 : 1) - (b.s.startsWith(q) ? 0 : 1)).slice(0, 14);
  box.innerHTML = hits.map(x => `<a href="#${x.k === "t" ? "team" : "player"}-${x.id}">${x.k === "t" ? (tlogo(x.id) ? `<img class="logo" src="${tlogo(x.id)}" alt="">` : "") : ""}<b>${esc(x.n)}</b><small>${esc(x.sub)}</small></a>`).join("") || `<div class="empty">No match</div>`;
  box.hidden = false;
}, 150));
document.addEventListener("click", e => { if (!e.target.closest(".search")) $("#qres").hidden = true; if (!e.target.closest(".colpick")) { const m = $("#pcolmenu"); if (m) m.hidden = true; } });
$("#qres").addEventListener("click", () => { $("#qres").hidden = true; $("#q").value = ""; });

let theme = store.get("theme", null); applyTheme(theme);
themeBtn.onclick = () => { theme = theme === null ? "light" : theme === "light" ? "dark" : null; store.set("theme", theme); applyTheme(theme); };
